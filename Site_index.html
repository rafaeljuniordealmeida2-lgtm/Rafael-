<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Entrega Rápida</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #000;
      color: white;
    }

    header {
      background: linear-gradient(135deg, #0d6efd, #000);
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: #111;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      border: 1px solid #0d6efd;
      box-shadow: 0 0 10px rgba(13,110,253,0.3);
      text-align: center;
    }

    .btn {
      background: linear-gradient(135deg, #0d6efd, #000);
      border: none;
      padding: 10px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      width: 100%;
      margin-top: 10px;
    }

    #carrinho {
      background: #0a0a0a;
      padding: 15px;
      border-radius: 15px;
      border: 1px solid #0d6efd;
      margin-top: 20px;
    }

  </style>
</head>

<body>

<header>
  🚀 Entrega Rápida
</header>

<div class="container">

  <!-- PRODUTOS -->
  <div class="card">
    <h3>Hambúrguer 🍔</h3>
    <p>R$ 15</p>
    <button class="btn" onclick="adicionar('Hambúrguer', 15)">
      Adicionar
    </button>
  </div>

  <div class="card">
    <h3>Pizza 🍕</h3>
    <p>R$ 30</p>
    <button class="btn" onclick="adicionar('Pizza', 30)">
      Adicionar
    </button>
  </div>

  <!-- CARRINHO -->
  <div id="carrinho">
    <h3>🛒 Seu Pedido</h3>
    <ul id="lista"></ul>
    <p id="total">Total: R$ 0</p>

    <button class="btn" onclick="finalizar()">
      Finalizar Pedido
    </button>
  </div>

</div>

<script>
let carrinho = [];

function adicionar(nome, preco) {
  let qtd = prompt("Quantidade:");

  if(qtd > 0){
    carrinho.push({nome, preco, qtd});
    atualizarCarrinho();
  }
}

function atualizarCarrinho() {
  let lista = document.getElementById("lista");
  let total = document.getElementById("total");

  lista.innerHTML = "";
  let soma = 0;

  carrinho.forEach((item, index) => {
    let subtotal = item.preco * item.qtd;

    let li = document.createElement("li");

    li.innerHTML = `
      ${item.nome} (x${item.qtd}) - R$ ${subtotal.toFixed(2)}
      <button onclick="remover(${index})">❌</button>
    `;

    lista.appendChild(li);

    soma += subtotal;
  });

  total.innerText = "Total: R$ " + soma.toFixed(2);
}

function remover(index) {
  carrinho.splice(index, 1);
  atualizarCarrinho();
}

function finalizar() {
  let mensagem = "Olá, quero fazer um pedido:%0A";

  let total = 0;

  carrinho.forEach(item => {
    let subtotal = item.preco * item.qtd;
    mensagem += `- ${item.nome} x${item.qtd} R$${subtotal.toFixed(2)}%0A`;
    total += subtotal;
  });

  mensagem += `%0ATotal: R$ ${total.toFixed(2)}`;

  let url = "https://wa.me/5583981378128?text=" + mensagem;

  window.open(url);
}

// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
